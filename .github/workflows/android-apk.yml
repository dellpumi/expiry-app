name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project and add our code
        run: |
          flutter create --org hu.gabor --project-name expiry_app --platforms=android build_app
          cp -R app_src/lib/. build_app/lib/

      - name: Add Firebase packages
        working-directory: build_app
        run: flutter pub add firebase_core firebase_auth cloud_firestore

      - name: Set the minimum Android version to 24
        working-directory: build_app
        run: perl -pi -e 's/minSdk(Version)?(\s*=)?\s*flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle*

      - name: Use AGP 9.3.3 so release lint does not crash
        working-directory: build_app
        run: |
          for f in android/settings.gradle android/settings.gradle.kts android/gradle/libs.versions.toml; do
            [ -f "$f" ] || continue
            perl -pi -e 's/(com\.android\.application["\)]\s*version\s*")[0-9.]+/${1}9.3.3/' "$f"
            perl -pi -e 's/^(agp\s*=\s*")[^"]+/${1}9.3.3/' "$f"
          done

      - name: Build the APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: expiry-app-apk
          path: build_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

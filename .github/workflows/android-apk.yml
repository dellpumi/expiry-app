name: Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project and add our code
        run: |
          flutter create --org hu --project-name expiry_app --platforms=android build_app
          cp -R app_src/lib/. build_app/lib/

      - name: Add Firebase and other packages
        working-directory: build_app
        run: flutter pub add firebase_core firebase_auth cloud_firestore connectivity_plus url_launcher timezone shared_preferences flutter_local_notifications:^19.0.0

      - name: Enable desugaring and notification permissions
        working-directory: build_app
        run: |
          perl -0pi -e 's/compileOptions \{/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
          perl -0pi -e 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <application#; s#</application>#    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n            </intent-filter>\n        </receiver>\n    </application>#' android/app/src/main/AndroidManifest.xml

      - name: Set the app name
        working-directory: build_app
        run: |
          perl -pi -e 's/android:label="[^"]*"/android:label="Product expiry &amp; shopping list tracker"/' android/app/src/main/AndroidManifest.xml

      - name: Set the minimum Android version to 24
        working-directory: build_app
        run: perl -pi -e 's/minSdk(Version)?(\s*=)?\s*flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle*

      - name: Use AGP 9.3.3 so release lint does not crash
        working-directory: build_app
        run: |
          for f in android/settings.gradle android/settings.gradle.kts android/gradle/libs.versions.toml; do
            [ -f "$f" ] || continue
            perl -pi -e 's/(com\.android\.application["\)]\s*version\s*")[0-9.]+/${1}9.3.3/' "$f"
            perl -pi -e 's/^(agp\s*=\s*")[^"]+/${1}9.3.3/' "$f"
          done

      - name: Build the APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: expiry-app-apk
          path: build_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
